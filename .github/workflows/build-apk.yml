
name: Build Naiwa Evolution APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q NaiwaEvolution-Android-Project.zip -d extracted

      - name: Fix Java and Kotlin versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("extracted/NaiwaEvolution/app/build.gradle")
          s = p.read_text()
          marker = "    defaultConfig {"
          fix = """    compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
          }

          kotlinOptions {
              jvmTarget = '17'
          }

          """
          if "sourceCompatibility JavaVersion.VERSION_17" not in s:
              if marker not in s:
                  raise SystemExit("Cannot find defaultConfig in app/build.gradle")
              s = s.replace(marker, fix + marker, 1)
          p.write_text(s)

      - name: Build APK
        run: |
          cd extracted/NaiwaEvolution
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NaiwaEvolution-APK
          path: extracted/NaiwaEvolution/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
